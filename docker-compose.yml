services:
  backend:
    build:
      context: backend
    container_name: gantt-backend
    ports:
      # Внешний 8000 на сервере занят aicards → бэкенд наружу на 8001.
      # Внутри docker-сети сервис всё равно на backend:8000 (см. nginx.conf).
      - "8001:8000"
    environment:
      # LLM опционален: без ключа работает детерминированный fallback.
      # Задайте через .env или переменные окружения при деплое.
      # Для Google AI Studio (бесплатный Gemini) достаточно LLM_API_KEY + LLM_MODEL (префикс gemini/).
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-3.6-flash}
      BASE_URL: ${BASE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://localhost:8080","http://95.142.46.44:8080"]}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: gantt-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped